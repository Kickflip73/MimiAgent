name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check repository hygiene
        run: npm run check:repo
      - name: Type-check
        run: npm run check
      - name: Test with coverage
        shell: bash
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/mimi-test-coverage.log"
          if npm run test:coverage 2>&1 | tee "$log"; then
            exit 0
          fi

          LOG_FILE="$log" node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const output = readFileSync(process.env.LOG_FILE, 'utf8');
          const lines = output.split('\n');
          const failures = lines
            .flatMap((line, index) => /^\s*not ok\b/.test(line) ? [lines.slice(index, index + 60).join('\n')] : []);
          const detail = (failures.join('\n') || output.slice(-6000)).slice(-6000);
          const escaped = detail
            .replaceAll('%', '%25')
            .replaceAll('\r', '%0D')
            .replaceAll('\n', '%0A');
          console.log(`::error title=Coverage tests failed::${escaped}`);
          NODE
          exit 1
      - name: Build
        run: npm run build
      - name: Test package
        run: npm run test:package

  macos-contract:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:repo
      - run: npm run check
      - run: swiftc -typecheck examples/connectors/macos-life-eventkit.swift
      - run: node --import tsx --import ./tests/test-environment.mjs --test tests/computer.test.ts tests/im-connectors.test.ts tests/macos-*-connector.test.ts
